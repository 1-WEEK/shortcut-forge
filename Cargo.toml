[package]
name = "shortcut-forge"
version = "0.2.1"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
toml = "1"
thiserror = "2"
anyhow = "1"
sha2 = "0.11"
base64 = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "macros", "fs", "io-util", "time", "signal"] }
axum = "0.8.9"
