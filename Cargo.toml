[package]
name = "shortcut-forge"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
thiserror = "1"
anyhow = "1"
sha2 = "0.10"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "macros", "fs", "io-util", "time", "signal"] }
axum = "0.8"
